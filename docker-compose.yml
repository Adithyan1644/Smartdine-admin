version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smartdine_postgres
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - smartdine-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartdine_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: admin123
    depends_on:
      - db
    networks:
      - smartdine-net

  frontend:
    build:
      context: ./smartdine-admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: smartdine_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smartdine-net

volumes:
  db_data:

networks:
  smartdine-net:
    driver: bridge
